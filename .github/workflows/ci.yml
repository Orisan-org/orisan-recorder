# Every attack in SECURITY-REVIEW-R1.md runs here, on every push and every
# pull request, on Linux and macOS. The README says so; this is what makes
# that true rather than aspirational.
#
# The attack tests need no network and no sibling repository: they build a
# tampered log on disk and assert `verify` catches it. `openssl` does the
# timestamp checking and is present on both runner images.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the first: CI that lags behind the
# branch is CI nobody waits for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    env:
      HAS_WITNESS_KEY: ${{ secrets.WITNESS_DEPLOY_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The README says Node 20+. Both ends of that are tested, or the
        # claim covers a version nothing runs.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      # The witness service lives in a separate PRIVATE repository, so a
      # runner needs a credential to read it. GITHUB_TOKEN is scoped to this
      # repo alone and cannot. With WITNESS_DEPLOY_KEY present, W1-W5 run;
      # without it they skip and say so. The job does not fail either way —
      # a fork, or a run before the key exists, still gets the other 470-odd
      # tests and all seven confirmed attacks.
      - name: Check out the witness service (optional)
        id: witness
        if: env.HAS_WITNESS_KEY == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Orisan-org/orisan-witness
          path: .witness
          ssh-key: ${{ secrets.WITNESS_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the witness service
        if: steps.witness.outcome == 'success'
        run: npm ci --prefix .witness

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Full suite
        run: npm test
        env:
          # Empty when the witness was not checked out, which the fixture
          # reads as "not available" and the suites report as skipped.
          ORISAN_WITNESS_SRC: ${{ steps.witness.outcome == 'success' && format('{0}/.witness/src', github.workspace) || '' }}

      # Say, in the run summary, whether the witness suites actually ran.
      # A skipped suite is invisible in a green tick, and these are the ones
      # that cover truncation, fork and rug-pull detection.
      - name: Report whether W1-W5 ran
        if: always()
        run: |
          if [ "${{ steps.witness.outcome }}" = "success" ]; then
            echo "W1-W5 RAN: the witness service was checked out." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "W1-W5 SKIPPED: no witness service available to this run." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "They are reported as skipped, never as passed. C1-C7, the confirmed" >> "$GITHUB_STEP_SUMMARY"
            echo "attacks in SECURITY-REVIEW-R1.md, need no witness and did run." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The suite passing is not the same as the attack tests having RUN.
      # A skipped suite still leaves a green tick, and "runs in CI
      # permanently" is a claim about execution, not about exit codes. This
      # step fails if any confirmed attack was skipped or vanished.
      - name: The attacks actually ran
        run: node scripts/assert-attacks-ran.mjs

  # Reported separately so a reader of the Actions tab sees the answer to
  # "are the attack tests really running" without opening a log.
  attacks:
    name: confirmed attacks (SECURITY-REVIEW-R1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: C1-C7
        run: npx vitest run test/attacks.test.ts test/attacker.test.ts test/hardening.test.ts
      - name: Assert none were skipped
        run: node scripts/assert-attacks-ran.mjs
